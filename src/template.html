<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>
  </head>
  <body>
    <div
      class="content grid grid-cols-[55rem] grid-rows-[repeat(4,min-content)] justify-center items-center min-h-screen bg-blue-50 py-8"
    >
      <div class="header flex flex-col justify-center items-center gap-2 mb-8">
        <h1 class="text-4xl font-bold">Weather for any city</h1>
        <p class="text-lg">
          Search for a city to see current weather information
        </p>
      </div>
      <div
        class="search-bar flex gap-4 justify-between items-center bg-white px-4 py-2 rounded-2xl"
      >
        <i class="icon"
          ><svg
            xmlns="http://www.w3.org/2000/svg"
            width="24px"
            height="24px"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="icon icon-tabler icons-tabler-outline icon-tabler-search"
          >
            <path stroke="none" d="M0 0h24v24H0z" fill="none" />
            <path d="M3 10a7 7 0 1 0 14 0a7 7 0 1 0 -14 0" />
            <path d="M21 21l-6 -6" /></svg
        ></i>
        <input
          id="city"
          type="text"
          placeholder="Search for a city..."
          class="flex-1 outline-none box-border"
        />
        <button
          id="searchBtn"
          aria-label="Search"
          class="search-btn bg-blue-900 px-4 py-2 rounded-2xl justify-self-end"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24px"
            height="24px"
            viewBox="0 0 24 24"
            fill="none"
            stroke="#ffffff"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="icon icon-tabler icons-tabler-outline icon-tabler-search"
          >
            <path stroke="none" d="M0 0h24v24H0z" fill="none" />
            <path d="M3 10a7 7 0 1 0 14 0a7 7 0 1 0 -14 0" />
            <path d="M21 21l-6 -6" />
          </svg>
        </button>
      </div>
      <div class="weather"></div>
    </div>
  </body>
</html>
